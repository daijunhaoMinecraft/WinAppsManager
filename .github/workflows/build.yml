name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Build WPF client
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: dotnet build WinAppsManager/WinAppsManager.sln -c Release --no-incremental

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WinAppsManager-client-build
          path: WinAppsManager/WinAppsManager/bin/Release/net6.0-windows7.0/
          if-no-files-found: error
          retention-days: 7

  test-backend:
    name: Test FastAPI backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r Backend/requirements.txt

      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s Backend/tests -v
